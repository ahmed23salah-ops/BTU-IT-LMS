{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | جامعة بني سويف التكنولوجية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #6c757d;
            --primary-color: #003366;
            --accent-color: #ffc107;
            --button-bg: #0056b3;
            --button-hover: #003d80;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #1e293b;
            --accent-color: #f59e0b;
            --button-bg: #2563eb;
            --button-hover: #1d4ed8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .login-card { background-color: var(--card-bg); padding: 40px 30px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        .login-header { text-align: center; margin-bottom: 25px; }
        .login-header h2 { font-size: 1.5rem; color: var(--text-color); margin-bottom: 8px; }
        .login-header p { font-size: 0.9rem; color: var(--text-muted); }
        
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-color); }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: var(--button-bg); }
        
        .submit-btn { width: 100%; padding: 12px; background-color: var(--button-bg); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background-color 0.3s; }
        .submit-btn:hover { background-color: var(--button-hover); }
        
        .back-home { display: block; text-align: center; margin-top: 20px; color: var(--button-bg); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .back-home:hover { text-decoration: underline; }

        /* رسائل الأخطاء إن وجدت */
        .error-message { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; text-align: center; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p>أدخل بيانات حسابك للمتابعة إلى المنصة</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>البريد الإلكتروني أو رقم الموبايل:</label>
                <input type="text" name="username" required placeholder="أدخل البريد أو رقم الهاتف">
            </div>
            
            <div class="form-group">
                <label>كلمة السر:</label>
                <input type="password" name="password" required placeholder="أدخل كلمة السر الخاصة بك">
            </div>

            <button type="submit" class="submit-btn">دخول للمنصة 🚀</button>
        </form>

        <a href="{% url 'home' %}" class="back-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
    </div>

</body>
</html>
