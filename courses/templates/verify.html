<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد البريد الإلكتروني - جامعة بني سويف التكنولوجية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 50px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 5px; }
        button { background-color: #2c3e50; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #34495e; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تأكيد حساب الطالب</h2>
        <p>قم بإدخال كود التحقق المكون من 6 أرقام والذي تم إرساله إلى بريدك الإلكتروني.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="code" placeholder="123456" maxlength="6" required>
            <button type="submit">تأكيد الحساب</button>
        </form>
    </div>

</body>
</html>
